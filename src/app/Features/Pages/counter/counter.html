<div class="min-h-screen bg-slate-50 px-4 py-12">
  <div class="mx-auto flex max-w-md flex-col items-center">

    <!-- Header -->
    <div class="mb-8 text-center">
      <span
        class="mb-3 inline-flex items-center rounded-full bg-blue-50 px-3 py-1 text-sm font-medium text-blue-600"
      >
        NgRx Learning
      </span>

      <h1 class="text-3xl font-bold tracking-tight text-slate-900">
        Counter
      </h1>

      <p class="mt-2 text-sm text-slate-500">
        Practice Actions, Reducers and Selectors
      </p>
    </div>

    <!-- Counter Card -->
    <div
      class="w-full rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"
    >
      <!-- Label -->
      <div class="mb-6 flex items-center justify-between">
        <span class="text-sm font-medium text-slate-500">
          Current Value
        </span>

        <span
          class="rounded-lg bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-600"
        >
          Store
        </span>
      </div>

      <!-- Value -->
      <div class="mb-8 flex justify-center">
        <span
          class="text-7xl font-bold tracking-tight text-slate-900"
        >
          {{ counter$ | async }}
        </span>
      </div>

      <!-- Actions -->
      <div class="grid grid-cols-3 gap-3">
        <button
          type="button"
          (click)="Decrement()"
          class="flex h-12 items-center justify-center rounded-xl border border-slate-200 bg-white text-xl font-semibold text-slate-700 transition hover:border-slate-300 hover:bg-slate-50 active:scale-95 cursor-pointer"
        >
          −
        </button>

        <button
          type="button"
          (click)="reset()"
          class="flex h-12 items-center justify-center rounded-xl bg-blue-600 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700 active:scale-95 cursor-pointer
          "
        >
          Reset
        </button>

        <button
          type="button"
          (click)="increment()"
          class="flex h-12 items-center justify-center rounded-xl border border-slate-200 bg-white text-xl font-semibold text-slate-700 transition hover:border-slate-300 hover:bg-slate-50 active:scale-95 cursor-pointer"
        >
          +
        </button>
      </div>
    </div>

    <!-- NgRx Flow -->
    <div class="mt-6 w-full rounded-2xl border border-slate-200 bg-white p-5">
      <h2 class="text-sm font-semibold text-slate-900">
        NgRx Flow
      </h2>

      <div class="mt-4 flex flex-wrap items-center justify-center gap-2 text-xs">
        <span class="rounded-lg bg-blue-50 px-3 py-2 font-medium text-blue-700">
          Component
        </span>

        <span class="text-slate-400">→</span>

        <span class="rounded-lg bg-purple-50 px-3 py-2 font-medium text-purple-700">
          Action
        </span>

        <span class="text-slate-400">→</span>

        <span class="rounded-lg bg-emerald-50 px-3 py-2 font-medium text-emerald-700">
          Reducer
        </span>

        <span class="text-slate-400">→</span>

        <span class="rounded-lg bg-orange-50 px-3 py-2 font-medium text-orange-700">
          State
        </span>
      </div>
    </div>

  </div>
</div>
